name: Deploy Express App to FLoCI EC2

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: floci-ec2-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted, Windows, X64]
    defaults:
      run:
        shell: powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command ". '{0}'"

    env:
      EC2_HOST: ${{ vars.EC2_HOST }}
      EC2_PORT: ${{ vars.EC2_PORT }}
      EC2_USER: ${{ vars.EC2_USER }}
      EC2_SSH_PRIVATE_KEY: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
      EC2_SSH_KNOWN_HOSTS: ${{ secrets.EC2_SSH_KNOWN_HOSTS }}

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Deploy over SSH
        run: |
          if ($env:EC2_HOST -notmatch '^[a-zA-Z0-9.-]+$' -or
              $env:EC2_USER -notmatch '^[a-zA-Z_][a-zA-Z0-9_-]*$' -or
              $env:EC2_PORT -notmatch '^[0-9]{1,5}$' -or
              [int]$env:EC2_PORT -lt 1 -or [int]$env:EC2_PORT -gt 65535 -or
              -not $env:EC2_SSH_PRIVATE_KEY -or -not $env:EC2_SSH_KNOWN_HOSTS) {
            throw "Configure EC2_HOST, EC2_PORT, EC2_USER and both SSH secrets"
          }

          $temp = Join-Path $env:RUNNER_TEMP ("ec2-deploy-" + [guid]::NewGuid())
          $identity = [System.Security.Principal.WindowsIdentity]::GetCurrent().User
          $acl = New-Object System.Security.AccessControl.DirectorySecurity
          $acl.SetAccessRuleProtection($true, $false)
          $rule = New-Object System.Security.AccessControl.FileSystemAccessRule(
            $identity, "FullControl", "ContainerInherit,ObjectInherit", "None", "Allow")
          $acl.AddAccessRule($rule)
          [System.IO.Directory]::CreateDirectory($temp, $acl) | Out-Null

          $remoteDir = $null
          try {
            $key = Join-Path $temp "id_key"
            $knownHosts = Join-Path $temp "known_hosts"
            $sshConfig = Join-Path $temp "ssh_config"
            $archive = Join-Path $temp "source.tar"
            [System.IO.File]::WriteAllText($key, ($env:EC2_SSH_PRIVATE_KEY.TrimEnd() + "`n"), [System.Text.Encoding]::ASCII)
            [System.IO.File]::WriteAllText($knownHosts, ($env:EC2_SSH_KNOWN_HOSTS.TrimEnd() + "`n"), [System.Text.Encoding]::ASCII)
            [System.IO.File]::WriteAllText($sshConfig, "Host *`n  UserKnownHostsFile `"$knownHosts`"`n", [System.Text.Encoding]::ASCII)
            git archive --format=tar "--output=$archive" HEAD
            if ($LASTEXITCODE -ne 0) { throw "Could not archive source" }

            $remote = "$env:EC2_USER@$env:EC2_HOST"
            $options = @("-F", $sshConfig, "-i", $key, "-o", "IdentitiesOnly=yes",
              "-o", "BatchMode=yes", "-o", "StrictHostKeyChecking=yes")
            $remoteDir = ssh @options -p $env:EC2_PORT $remote "mktemp -d /tmp/ec2-docker-cicd-XXXXXXXX"
            if ($LASTEXITCODE -ne 0 -or $remoteDir -notmatch '^/tmp/ec2-docker-cicd-[a-zA-Z0-9]{8}$') {
              $remoteDir = $null
              throw "Could not create a temporary directory on EC2"
            }
            scp -O @options -P $env:EC2_PORT $archive "${remote}:$remoteDir/source.tar"
            if ($LASTEXITCODE -ne 0) { throw "Could not upload source to EC2" }

            $command = "tar -xf '$remoteDir/source.tar' -C '$remoteDir' && docker build -t ec2-docker-cicd-app:latest '$remoteDir' && " +
              'container=$(docker ps -aq --filter name=^/ec2-docker-cicd-app$) && { [ -z "$container" ] || docker rm -f "$container"; } && docker run -d --name ec2-docker-cicd-app --restart unless-stopped -p 4000:4000 ec2-docker-cicd-app:latest'
            ssh @options -p $env:EC2_PORT $remote $command
            if ($LASTEXITCODE -ne 0) { throw "EC2 deployment failed" }
          }
          finally {
            if ($remoteDir) {
              ssh @options -p $env:EC2_PORT $remote "rm -rf -- '$remoteDir'"
              if ($LASTEXITCODE -ne 0) { Write-Warning "Could not remove temporary EC2 directory $remoteDir" }
            }
            Remove-Item -LiteralPath $temp -Recurse -Force
          }
